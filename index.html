<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microregistrar — Revision Tracker</title>
  <meta name="description" content="Admin dashboard for the Microregistrar clinical microbiology revision spreadsheet.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-logo">M</span>
        <span>Microregistrar<small>Revision tracker</small></span>
      </a>
      <nav class="nav">
        <div class="nav-title">Overview</div>
        <a class="nav-link" href="#/"><span class="nav-ico">🏠</span>Dashboard</a>
        <div class="nav-title">Spreadsheet tabs</div>
        <div id="nav-tabs"><!-- populated from data --></div>
      </nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="icon-btn" id="btn-menu" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="global-search" type="search" placeholder="Search all tabs… (press Enter)" aria-label="Search all records">
          <span class="kbd-hint">/</span>
        </div>
        <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1XzlEPyzUM3ljxjzMrxpXLH-Pu_xTlWGC8AtrlRzp5Zw/edit"
           target="_blank" rel="noopener noreferrer">Source sheet ↗</a>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </header>

      <main id="main">
        <div class="state-box"><div class="spinner"></div><p>Loading…</p></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-close aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
