<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microregistrar Study Tracker</title>
  <meta name="description" content="Admin dashboard generated from the Microregistrar moodlecloud Google Sheet." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" aria-label="Toggle navigation menu">&#9776;</button>
      <a href="#/home" class="brand">
        <span class="brand-emoji">&#129514;</span>
        <span>Microregistrar<span class="brand-sub"> &middot; Study Tracker</span></span>
      </a>
      <div class="global-search">
        <input id="globalSearchInput" type="search" autocomplete="off" placeholder="Search all tabs (topics, links, sections)&hellip;" aria-label="Search all tabs" />
        <div id="globalSearchResults" class="search-results" hidden></div>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">&#127775;</button>
      </div>
    </header>

    <div class="layout">
      <div id="sidebarOverlay" class="sidebar-overlay"></div>
      <nav id="sidebar" class="sidebar">
        <a href="#/home" class="nav-link" data-route="home"><span class="nl-icon">&#127968;</span><span>Home</span></a>
        <div class="nav-section-label">Sheet Tabs</div>
        <div id="sidebarTabs"></div>
      </nav>
      <main id="mainContent" class="main-content" aria-live="polite"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="data/seed-data.js"></script>
  <script src="js/tabs-config.js"></script>
  <script src="js/data-layer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
