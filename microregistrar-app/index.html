<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microregistrar Moodlecloud</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">🦠</span>
        <span>Microregistrar</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-sm" id="btn-import" title="Import JSON">Import</button>
        <button class="btn btn-sm" id="btn-export" title="Export JSON">Export</button>
        <button class="btn btn-sm" id="btn-reset" title="Reset to seed data">Reset</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="search-bar">
          <input type="search" id="global-search" placeholder="Search across all sections…" autocomplete="off">
        </div>
        <div class="topbar-actions">
          <button class="btn btn-icon" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle theme">🌓</button>
        </div>
      </header>
      <main class="content" id="page-content">
        <div class="loading"><div class="spinner"></div><p>Loading…</p></div>
      </main>
    </div>
  </div>

  <script src="js/data-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
