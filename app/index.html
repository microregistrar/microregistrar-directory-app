<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microregistrar Sheet App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="nav-overlay" class="mobile-nav-overlay" hidden></div>
      <aside class="sidebar" id="sidebar" aria-label="Primary">
        <div class="brand">
          <div class="brand-title">Microregistrar</div>
          <div class="brand-sub">Moodlecloud sheet → web app</div>
        </div>
        <div class="nav-section-label">Navigate</div>
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar-footer">
          <div class="nav-section-label">Data</div>
          <button class="btn btn-sm" type="button" id="export-json">Export JSON</button>
          <label class="btn btn-sm" for="import-json">Import JSON</label>
          <input id="import-json" type="file" accept="application/json,.json" hidden />
          <button class="btn btn-sm btn-danger" type="button" id="reset-data">Reset snapshot</button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="btn btn-sm menu-toggle" type="button" id="menu-toggle" aria-label="Open menu">Menu</button>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="global-search"
              type="search"
              placeholder="Search all tabs… (Enter)"
              aria-label="Search all tabs"
            />
          </div>
          <div class="topbar-actions">
            <button class="btn btn-sm" type="button" id="theme-toggle">Dark</button>
            <a class="btn btn-sm" href="#/">Home</a>
          </div>
        </header>
        <main class="content" id="content" aria-live="polite"></main>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Edit</h2>
        <div id="modal-body"></div>
        <div class="modal-actions">
          <button class="btn" type="button" id="modal-cancel">Cancel</button>
          <button class="btn btn-primary" type="button" id="modal-save">Save</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="./js/data-access.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
